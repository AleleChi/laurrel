services:
  - type: web
    name: laurrel-backend-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: laurrel-postgres
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_API_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Laurrel Dispatch <dispatch@laurrelservices.ca>
      - key: ENQUIRY_TO_EMAIL
        value: info@laurrelservices.ca

databases:
  - name: laurrel-postgres
    plan: starter
    databaseName: laurrel_production
    user: laurrel_admin
